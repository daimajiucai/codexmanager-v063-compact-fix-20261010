name: Build CodexManager 0.6.3 compact fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexmanager-v063-linux-amd64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out only the build repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free unused SDK space on the disposable GitHub runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          free -h
      - name: Test source patch and original build safety guards
        run: |
          python3 test_patch.py
          python3 test_cloud.py
      - name: Compile, run Rust tests, compare runtime config, and verify startup
        env:
          DOCKER_BUILDKIT: '1'
          BUILD_JOBS: '2'
        run: bash build-cloud.sh
      - name: Upload the verified image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codexmanager-service-0.6.3-compact-fix-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
